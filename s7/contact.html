<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Centria Edu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container header-content">
            <div class="logo">centria <span>edu</span></div>

            <nav>
                <a href="index.html">Home</a>
                <a href="index.html#topics">Topics</a>
                <a href="index.html#about">About</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <p>
                    Please fill in the form below to contact us.
                    We will get back to you as soon as possible.
                </p>

                <form class="card"
                      action="https://httpbin.org/post"
                      method="post">

                    <!-- Name -->
                    <label for="name">Name *</label>
                    <input type="text"
                           id="name"
                           name="name"
                           autocomplete="name"
                           required>

                    <!-- Email -->
                    <label for="email">Email address *</label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           required>

                    <!-- Phone -->
                    <label for="phone">Phone number</label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           autocomplete="tel">

                    <!-- Subject -->
                    <label for="subject">Contact subject *</label>
                    <select id="subject"
                            name="subject"
                            required>

                        <option value="">Choose a subject</option>
                        <option value="feedback">Feedback</option>
                        <option value="question">Question</option>
                        <option value="other">Other</option>
                    </select>

                    <!-- Preferred contact method -->
                    <fieldset>
                        <legend>Preferred contact method *</legend>

                        <label for="method-email">
                            <input type="radio"
                                   id="method-email"
                                   name="contact_method"
                                   value="email"
                                   required>
                            Email
                        </label>

                        <label for="method-phone">
                            <input type="radio"
                                   id="method-phone"
                                   name="contact_method"
                                   value="phone">
                            Phone
                        </label>
                    </fieldset>

                    <!-- Message -->
                    <label for="message">Message *</label>
                    <textarea id="message"
                              name="message"
                              rows="5"
                              required></textarea>

                    <!-- Submit button -->
                    <button type="submit">
                        Send message
                    </button>

                </form>

            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Original author: Centria Edu</p>
            <p>Modified by: Khaled Mohamed</p>
        </div>
    </footer>

</body>
</html>
